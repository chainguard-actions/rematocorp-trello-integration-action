name: Test trello-list-id-override, trello-list-id-pr-approved, and trello-list-id-pr-changes-requested inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock PR event payload with review state
        run: |
          mkdir -p /tmp/github-events
          cat > /tmp/github-events/event.json << 'EOF'
          {
            "action": "opened",
            "pull_request": {
              "number": 88,
              "title": "Feature with review",
              "body": "Testing list ID inputs. https://trello.com/c/listtest/3-list-card",
              "draft": false,
              "head": {
                "ref": "feature/review-test",
                "sha": "55667788"
              },
              "base": {
                "ref": "main"
              },
              "user": {
                "login": "reviewdev"
              },
              "assignees": [],
              "requested_reviewers": [
                {"login": "reviewer1"}
              ],
              "merged": false,
              "state": "open"
            },
            "repository": {
              "full_name": "test-owner/test-repo"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: /tmp/github-events/event.json
          GITHUB_EVENT_NAME: pull_request
        with:
          github-token: ${{ github.token }}
          trello-api-key: fake-api-key
          trello-auth-token: fake-auth-token
          github-require-trello-card: false
          github-include-pr-comments: false
          trello-list-id-pr-open: fake-open-list-id
          trello-list-id-pr-approved: fake-approved-list-id
          trello-list-id-pr-changes-requested: fake-changes-requested-list-id
          trello-list-id-override: fake-override-list-id

      - name: Assert action executed with list ID inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action should process the PR with all list ID inputs configured.
          # With fake credentials it will fail at the Trello API call, which is expected.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action executed with trello-list-id-override, trello-list-id-pr-approved, and trello-list-id-pr-changes-requested inputs"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
