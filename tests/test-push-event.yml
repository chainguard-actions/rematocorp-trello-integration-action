name: Test action invocation on push event
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: fake-github-token
          trello-api-key: fake-trello-api-key
          trello-auth-token: fake-trello-auth-token
          github-require-trello-card: "false"
          github-include-pr-comments: "false"
          github-include-pr-commit-messages: "false"
          github-include-pr-branch-name: "false"

      - name: Assert action was invoked on push event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # On a push event (not a PR), the action may exit early or fail on API calls.
          # We just verify the action is invocable in this context.
          echo "PASS: action invoked on push event (outcome=$OUTCOME)"
