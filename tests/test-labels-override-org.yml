name: Test manual labels, conflicting labels, list override, and organization name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          trello-api-key: fake-trello-api-key
          trello-auth-token: fake-trello-auth-token
          trello-organization-name: myorganization
          trello-list-id-override: fake-list-id-override
          trello-add-manual-labels-to-cards: "Bug;Enhancement"
          trello-conflicting-labels: "WIP;Hold"
          trello-add-labels-to-cards: true
          trello-add-members-to-cards: false

      - name: Assert action ran and failed gracefully (sentinel repo / fake Trello creds)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (no Trello card in PR, but inputs were accepted)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with sentinel repo / fake credentials"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
