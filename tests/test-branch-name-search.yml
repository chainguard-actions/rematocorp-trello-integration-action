name: Test branch name search for Trello card ID
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/feature/1234-my-feature
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature/1234-my-feature
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: fake-github-token
          trello-api-key: fake-api-key
          trello-auth-token: fake-auth-token
          github-include-pr-branch-name: 'true'
          github-include-pr-comments: 'false'
      - name: Assert action ran (expected to fail due to invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail with invalid credentials"
            exit 1
          fi
          echo "PASS: action failed as expected with invalid credentials"
