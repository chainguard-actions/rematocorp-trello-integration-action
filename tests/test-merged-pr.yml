name: Test merged PR handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock merged PR event payload with Trello card
        run: |
          mkdir -p /tmp/github-events
          cat > /tmp/github-events/event.json << 'EOF'
          {
            "action": "closed",
            "pull_request": {
              "number": 100,
              "title": "Merge feature Y",
              "body": "Closes https://trello.com/c/merge001/5-merged-card\n\nFeature Y is complete.",
              "draft": false,
              "head": {
                "ref": "feature/feature-y",
                "sha": "99887766"
              },
              "base": {
                "ref": "main"
              },
              "user": {
                "login": "mergedev"
              },
              "assignees": [],
              "requested_reviewers": [],
              "merged": true,
              "state": "closed"
            },
            "repository": {
              "full_name": "test-owner/test-repo"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: /tmp/github-events/event.json
          GITHUB_EVENT_NAME: pull_request
        with:
          github-token: ${{ github.token }}
          trello-api-key: fake-api-key
          trello-auth-token: fake-auth-token
          trello-list-id-pr-merged: fake-merged-list-id
          trello-list-id-pr-closed: fake-closed-list-id
          github-require-trello-card: false
          github-include-pr-comments: false

      - name: Assert action ran for merged PR
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action should process the merged PR and attempt to move the card
          # to the merged list. With fake credentials it will fail at the API call.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action executed for merged PR scenario"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
