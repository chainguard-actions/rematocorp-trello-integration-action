name: Test require-trello-card error when no card found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock PR event payload without Trello card
        run: |
          mkdir -p /tmp/github-events
          cat > /tmp/github-events/event.json << 'EOF'
          {
            "action": "opened",
            "pull_request": {
              "number": 42,
              "title": "Fix something",
              "body": "This PR has no Trello card link at all.",
              "draft": false,
              "head": {
                "ref": "fix/something",
                "sha": "deadbeef"
              },
              "base": {
                "ref": "main"
              },
              "user": {
                "login": "devuser"
              },
              "assignees": [],
              "requested_reviewers": [],
              "merged": false,
              "state": "open"
            },
            "repository": {
              "full_name": "test-owner/test-repo"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: /tmp/github-events/event.json
          GITHUB_EVENT_NAME: pull_request
        with:
          github-token: ${{ github.token }}
          trello-api-key: fake-api-key
          trello-auth-token: fake-auth-token
          github-require-trello-card: true
          github-include-pr-comments: false
          github-include-pr-branch-name: false

      - name: Assert action failed due to missing Trello card
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # When github-require-trello-card is true and no card is found,
          # the action should fail with an error.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when no Trello card was found and require-trello-card=true"
          else
            echo "FAIL: expected action to fail but got outcome: $OUTCOME"
            exit 1
          fi
