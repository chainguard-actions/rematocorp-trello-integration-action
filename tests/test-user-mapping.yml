name: Test user mapping input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          trello-api-key: fake-trello-api-key
          trello-auth-token: fake-trello-auth-token
          github-users-to-trello-users: |-
            GithubUser1:TrelloUser1
            GithubUser2:TrelloUser2
          trello-add-members-to-cards: 'true'
          trello-remove-unrelated-members: 'true'
      - name: Assert action ran (user mapping accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with user mapping"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake credentials and sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
