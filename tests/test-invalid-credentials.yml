name: Test invalid Trello credentials error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock PR event payload
        run: |
          mkdir -p /tmp/github-events
          cat > /tmp/github-events/event.json << 'EOF'
          {
            "action": "opened",
            "pull_request": {
              "number": 1,
              "title": "Test PR",
              "body": "This is a test PR with no Trello card link",
              "draft": false,
              "head": {
                "ref": "feature/test-branch",
                "sha": "abc123"
              },
              "base": {
                "ref": "main"
              },
              "user": {
                "login": "testuser"
              },
              "assignees": [],
              "requested_reviewers": [],
              "merged": false,
              "state": "open"
            },
            "repository": {
              "full_name": "test-owner/test-repo"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: /tmp/github-events/event.json
          GITHUB_EVENT_NAME: pull_request
        with:
          github-token: ${{ github.token }}
          trello-api-key: fake-api-key
          trello-auth-token: fake-auth-token
          github-require-trello-card: false

      - name: Assert action ran (may fail due to invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action should either succeed (no card required, no Trello calls needed)
          # or fail with an authentication error from Trello API — both are acceptable
          # outcomes that confirm the action executed and processed inputs correctly.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action executed and produced a deterministic outcome"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
