name: Test require-trello-card fails when no card found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: fake-github-token
          trello-api-key: fake-trello-api-key
          trello-auth-token: fake-trello-auth-token
          github-require-trello-card: "true"
          github-include-pr-comments: "false"
          github-include-pr-commit-messages: "false"
          github-include-pr-branch-name: "false"

      - name: Assert action failed due to missing Trello card
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when github-require-trello-card=true and no card found, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no Trello card was found"
