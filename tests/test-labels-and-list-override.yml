name: Test manual labels, conflicting labels, and list ID override
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with manual labels, conflicting labels, and list override inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          github-require-trello-card: 'false'
          github-include-pr-comments: 'false'
          github-include-pr-commit-messages: 'false'
          github-include-pr-branch-name: 'false'
          trello-api-key: 'fake-api-key'
          trello-auth-token: 'fake-auth-token'
          trello-add-labels-to-cards: 'true'
          trello-add-manual-labels-to-cards: 'label-one;label-two'
          trello-conflicting-labels: 'conflicting-label'
          trello-list-id-override: 'fake-override-list-id'
          trello-add-members-to-cards: 'false'

      - name: Assert action ran with label and list override configuration
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action runs under workflow_dispatch with no PR context.
          # We verify the action ran (not skipped) with label and list override configuration.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with label/conflicting-label/list-override configuration, outcome=$OUTCOME"
