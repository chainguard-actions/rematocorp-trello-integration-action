name: Test draft PR handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock draft PR event payload with Trello card
        run: |
          mkdir -p /tmp/github-events
          cat > /tmp/github-events/event.json << 'EOF'
          {
            "action": "opened",
            "pull_request": {
              "number": 55,
              "title": "WIP: Draft feature",
              "body": "https://trello.com/c/draft001/4-draft-card\n\nWork in progress.",
              "draft": true,
              "head": {
                "ref": "feature/wip-draft",
                "sha": "aabbccdd"
              },
              "base": {
                "ref": "main"
              },
              "user": {
                "login": "wipdev"
              },
              "assignees": [],
              "requested_reviewers": [],
              "merged": false,
              "state": "open"
            },
            "repository": {
              "full_name": "test-owner/test-repo"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: /tmp/github-events/event.json
          GITHUB_EVENT_NAME: pull_request
        with:
          github-token: ${{ github.token }}
          trello-api-key: fake-api-key
          trello-auth-token: fake-auth-token
          trello-list-id-pr-draft: fake-draft-list-id
          trello-list-id-pr-open: fake-open-list-id
          github-require-trello-card: false
          github-include-pr-comments: false

      - name: Assert action ran for draft PR
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action should process the draft PR and attempt to move the card
          # to the draft list. With fake credentials it will fail at the API call.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action executed for draft PR scenario"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
