name: Test draft PR configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with draft PR list configuration
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          github-require-trello-card: 'false'
          github-include-pr-comments: 'false'
          github-include-pr-commit-messages: 'false'
          github-include-pr-branch-name: 'false'
          trello-api-key: 'fake-api-key'
          trello-auth-token: 'fake-auth-token'
          trello-list-id-pr-draft: 'fake-draft-list-id'
          trello-list-id-pr-open: 'fake-open-list-id'
          trello-list-id-pr-closed: 'fake-closed-list-id'
          trello-list-id-pr-merged: 'fake-merged-list-id'
          trello-add-members-to-cards: 'false'
          trello-add-labels-to-cards: 'false'
          trello-archive-on-merge: 'false'

      - name: Assert action ran with draft PR list configuration
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action runs under workflow_dispatch with no PR context.
          # We verify the action ran (not skipped) with the draft PR list configuration.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with draft PR list configuration, outcome=$OUTCOME"
