name: Test PR open scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          github-require-keyword-prefix: false
          github-enable-related-keyword-prefix: false
          github-require-trello-card: false
          github-include-pr-comments: true
          github-include-pr-commit-messages: false
          github-include-pr-branch-name: false
          github-users-to-trello-users: |-
            GithubUser1:TrelloUser1
            GithubUser2:TrelloUser2
          trello-api-key: fake-api-key
          trello-auth-token: fake-auth-token
          trello-organization-name: my-org
          trello-board-id: fake-board-id
          trello-list-id-pr-draft: fake-list-draft
          trello-list-id-pr-open: fake-list-open
          trello-list-id-pr-changes-requested: fake-list-changes
          trello-list-id-pr-approved: fake-list-approved
          trello-list-id-pr-closed: fake-list-closed
          trello-list-id-pr-merged: fake-list-merged
          trello-list-id-override: ""
          trello-add-labels-to-cards: true
          trello-add-manual-labels-to-cards: "bug;enhancement"
          trello-conflicting-labels: "blocked"
          trello-card-position: top
          trello-add-members-to-cards: true
          trello-switch-members-in-review: false
          trello-remove-unrelated-members: true
          trello-archive-on-merge: false
      - name: Assert action ran (may fail due to fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action executed (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
