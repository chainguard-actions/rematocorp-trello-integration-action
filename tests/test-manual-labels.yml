name: Test trello-add-manual-labels-to-cards and trello-conflicting-labels inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock PR event payload
        run: |
          mkdir -p /tmp/github-events
          cat > /tmp/github-events/event.json << 'EOF'
          {
            "action": "opened",
            "pull_request": {
              "number": 77,
              "title": "Add label management feature",
              "body": "Testing manual labels. https://trello.com/c/xyz789/2-label-card",
              "draft": false,
              "head": {
                "ref": "feature/label-management",
                "sha": "11223344"
              },
              "base": {
                "ref": "main"
              },
              "user": {
                "login": "labeldev"
              },
              "assignees": [],
              "requested_reviewers": [],
              "merged": false,
              "state": "open"
            },
            "repository": {
              "full_name": "test-owner/test-repo"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: /tmp/github-events/event.json
          GITHUB_EVENT_NAME: pull_request
        with:
          github-token: ${{ github.token }}
          trello-api-key: fake-api-key
          trello-auth-token: fake-auth-token
          github-require-trello-card: false
          github-include-pr-comments: false
          trello-add-labels-to-cards: true
          trello-add-manual-labels-to-cards: "bug;enhancement;needs-review"
          trello-conflicting-labels: "wip;blocked"

      - name: Assert action executed with label inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action should process the PR with manual labels and conflicting labels config.
          # With fake credentials it will fail at the Trello API call, which is expected.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action executed with trello-add-manual-labels-to-cards and trello-conflicting-labels inputs"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
