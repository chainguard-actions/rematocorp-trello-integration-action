name: Test branch name card detection configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: 1234-my-feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: fake-github-token
          trello-api-key: fake-trello-api-key
          trello-auth-token: fake-trello-auth-token
          github-require-trello-card: "false"
          github-include-pr-comments: "false"
          github-include-pr-commit-messages: "false"
          github-include-pr-branch-name: "true"

      - name: Assert action was invoked with branch-name detection enabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will attempt to find card 1234 from the branch name "1234-my-feature-branch"
          # With fake credentials, it will fail on Trello API calls — that is expected.
          # We just verify the action was invocable with this configuration.
          echo "PASS: action invoked with github-include-pr-branch-name=true (outcome=$OUTCOME)"
